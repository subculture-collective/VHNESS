name: headless-core-release
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Repository-scoped isolated qualification runner
        required: false
        default: ubuntu-latest
      source_revision:
        description: Exact already-published source for receipt recovery; otherwise leave empty
        required: false
      published_digest:
        description: Immutable already-published core digest for receipt recovery; skips build and push
        required: false
  push:
    tags: ['core-v*']
    branches: [main]
    paths:
      - docs/reference/core-version.json
permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 120
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vhness
          POSTGRES_PASSWORD: disposable-release-only
          POSTGRES_DB: vhness_release
        options: --label vhness.release-database=${{ github.run_id }}-${{ github.run_attempt }} --health-cmd "pg_isready -U vhness -d vhness_release" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Select the core version
        id: select
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("docs/reference/core-version.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "docs/releases/core-release-$version.json" ] && [ -z "${CORE_RECOVERY_DIGEST:-}" ]; then
            echo "Core $version already has a committed receipt; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CORE_RECOVERY_DIGEST: ${{ inputs.published_digest }}
      - uses: actions/setup-go@v5
        if: steps.select.outputs.release == 'true'
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install backend media verification tools
        if: steps.select.outputs.release == 'true'
        run: |
          if [ "$(id -u)" = 0 ]; then
            apt-get update && apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg
          else
            sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends poppler-utils util-linux ffmpeg
          fi
      - name: Verify independent core
        if: steps.select.outputs.release == 'true'
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$TEST_DATABASE_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          test_db_id=$(docker ps --no-trunc --quiet --filter "label=vhness.release-database=$TEST_DATABASE_RUN")
          [[ "$test_db_id" =~ ^[0-9a-f]{64}$ ]]
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$test_db_id")
          [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          export TEST_DATABASE_URL="postgres://vhness:disposable-release-only@$test_db_ip:5432/vhness_release?sslmode=disable"
          make verify-core
          python3 -m unittest discover -s scripts -p 'test_core_release.py'
          test -z "$(git status --porcelain)"
      - name: Publish immutable core image and receipt
        if: steps.select.outputs.release == 'true'
        env:
          ARCHIVE_PACKAGE_TOKEN: ${{ secrets.ARCHIVE_PACKAGE_TOKEN }}
          ARCHIVE_REGISTRY_USER: ${{ vars.ARCHIVE_REGISTRY_USER }}
          CORE_RECOVERY_SOURCE: ${{ inputs.source_revision }}
          CORE_RECOVERY_DIGEST: ${{ inputs.published_digest }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_PACKAGE_TOKEN"
          test -n "$ARCHIVE_REGISTRY_USER"
          core_version=$(python3 -c 'import json; print(json.load(open("docs/reference/core-version.json"))["version"])')
          core_source=$(git rev-parse HEAD)
          [[ "$core_source" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/core-v$core_version"
          fi
          release_auth_dir=$(mktemp -d)
          trap 'rm -rf "$release_auth_dir"' EXIT
          chmod 700 "$release_auth_dir"
          export DOCKER_CONFIG="$release_auth_dir/docker"
          printf '%s' "$ARCHIVE_PACKAGE_TOKEN" | docker login git.subcult.tv --username "$ARCHIVE_REGISTRY_USER" --password-stdin
          if [ -n "$CORE_RECOVERY_DIGEST" ]; then
            [[ "$CORE_RECOVERY_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$core_source" = "$CORE_RECOVERY_SOURCE"
            [[ "$CORE_RECOVERY_DIGEST" =~ ^git.subcult.tv/subculture-collective/archive-core@sha256:[0-9a-f]{64}$ ]]
            core_image="$CORE_RECOVERY_DIGEST"
            docker pull "$core_image"
          else
            test -z "$CORE_RECOVERY_SOURCE"
            core_image="git.subcult.tv/subculture-collective/archive-core:$core_source"
            docker build --target core --build-arg "CORE_VERSION=$core_version" --build-arg "SOURCE_REVISION=$core_source" --label "org.opencontainers.image.revision=$core_source" --label "org.opencontainers.image.version=$core_version" --label org.subcult.archive-artifact=core -t "$core_image" .
          fi
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$core_image")" = "$core_source"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$core_image")" = "$core_version"
          test "$(docker inspect --format '{{index .Config.Labels "org.subcult.archive-artifact"}}' "$core_image")" = core
          docker run --rm --entrypoint sh "$core_image" -c 'test ! -e /app/web && ! command -v node && ! command -v npm'
          test -z "$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$core_image" | sed -n '/^VHNESS_WEB=/p')"
          if [ -z "$CORE_RECOVERY_DIGEST" ]; then docker push "$core_image"; fi
          core_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$core_image")
          python3 scripts/core_release.py --engine-digest "$core_digest" --output ".artifacts/core-release-$core_version.json"
      - uses: actions/upload-artifact@v3
        if: steps.select.outputs.release == 'true'
        with:
          name: headless-core-release
          path: .artifacts/core-release-*.json
          if-no-files-found: error
          include-hidden-files: true
