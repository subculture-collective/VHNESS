name: Release receipts
run-name: Release receipts ${{ github.sha }}
# Gitea Actions publishes the core image and the viewer package when a version
# bump reaches its copy of main, but Gitea pull requests are off. This job waits
# for the published artifact, writes its receipt from the registry, and lands it
# here through a pull request that merges once Mirror CI passes.
on:
  push:
    branches: [main]
    paths:
      - docs/reference/core-version.json
      - packages/viewer/package.json
  workflow_dispatch: null
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
concurrency:
  group: release-receipts
  cancel-in-progress: false
jobs:
  receipts:
    name: Record published releases
    if: github.repository == 'subculture-collective/arkhiv'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the published artifacts and write their receipts
        run: python3 scripts/land_release_receipts.py --wait-minutes 150
      - name: Land the receipts through an auto-merging pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/releases)" ]; then
            echo "Receipts already committed."
            exit 0
          fi
          added=$(git status --porcelain -- docs/releases | awk '{print $2}')
          branch="release/receipts-${GITHUB_SHA::12}"
          git fetch --quiet origin main
          git stash push --include-untracked --quiet -- docs/releases
          git switch -c "$branch" origin/main
          git stash pop --quiet
          git add docs/releases
          # Commit as the Actions bot: the main ruleset asks for an extra approval
          # when a bot pushes a commit whose author is not a GitHub account.
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false \
            commit -m "release: record published receipts for ${GITHUB_SHA::12}" -m "$(git status --porcelain -- docs/releases | sed 's/^/  /')"
          # A rerun replaces this job's own branch and reuses its pull request.
          git push --force origin "$branch"
          url=$(gh pr view "$branch" --json url --jq .url 2>/dev/null || gh pr create --base main --head "$branch" --title "Record published release receipts" \
            --body "Receipts written by the Release receipts workflow from the artifacts Gitea Actions published for \`$GITHUB_SHA\`.")
          # Pushes and pull requests made with this token start no workflows, so
          # run Mirror CI explicitly. GitHub does not link a dispatched run to the
          # pull request, so record its result as the required "Mirror CI gate"
          # check on the branch head, then let the PR merge. Create the check
          # before dispatching: an API-created check joins the commit's first
          # Actions check suite, and once the dispatched run exists that can be
          # the run's own suite, which the pull request does not count.
          head=$(git rev-parse HEAD)
          check_id=$(gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name='Mirror CI gate' -f head_sha="$head" \
            -f status=in_progress -f 'output[title]=Waiting for Mirror CI' \
            -f "output[summary]=Mirror CI is being dispatched for $head." --jq .id)
          gh workflow run mirror-ci.yml --ref "$branch"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow mirror-ci.yml --branch "$branch" --event workflow_dispatch --commit "$head" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          test -n "$run_id"
          conclusion=success
          gh run watch "$run_id" --exit-status --interval 30 > /dev/null || conclusion=failure
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
            -f status=completed -f conclusion="$conclusion" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            -f "output[title]=Mirror CI $conclusion" -f "output[summary]=Dispatched Mirror CI run $run_id: $conclusion on $head." > /dev/null
          test "$conclusion" = success
          gh pr merge --auto --squash "$url"
          echo "$url"
          # Propose the new releases to the consumers once the receipt merges. A
          # merge made through this token starts no push workflows, so dispatch it.
          state=""
          for _ in $(seq 1 60); do
            state=$(gh pr view "$url" --json state --jq .state)
            [ "$state" = OPEN ] || break
            sleep 30
          done
          test "$state" = MERGED
          for file in $added; do
            case "$file" in
              */core-release-*.json) kind=core; version=${file##*/core-release-} ;;
              */viewer-release-*.json) kind=viewer; version=${file##*/viewer-release-} ;;
              *) continue ;;
            esac
            gh workflow run consumer-upgrades.yml -f kind="$kind" -f version="${version%.json}"
          done
